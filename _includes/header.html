{%- assign home = t.home_url | relative_url -%}
{%- if page.ref == 'home' -%}{%- assign anchor = '' -%}{%- else -%}{%- assign anchor = home -%}{%- endif -%}
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ home }}" aria-label="{{ site.author.name }}">
      <span class="brand-mark">AC</span>
      <span class="brand-name">{{ site.author.name }}</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="{{ t.projects_url | relative_url }}" {% if page.ref == 'projects' %}aria-current="page"{% endif %}>{{ t.nav_projects }}</a>
      <a class="nav-experience" href="{{ anchor }}#experience">{{ t.nav_experience }}</a>
      <a href="{{ t.blog_url | relative_url }}" {% if page.ref == 'blog' or page.layout == 'post' %}aria-current="page"{% endif %}>{{ t.nav_writing }}</a>
      <a class="nav-contact" href="{{ anchor }}#contact">{{ t.nav_contact }}</a>
      <a class="lang-switch" href="{{ alt_url }}" hreflang="{{ other_lang }}" lang="{{ other_lang }}" title="{{ t.switch_title }}" aria-label="{{ t.switch_title }}">{{ t.switch_label }}</a>
      <button class="theme-toggle" type="button" aria-label="{{ t.toggle_theme }}" title="{{ t.toggle_theme }}">
        {% include icon.html name="sun" %}{% include icon.html name="moon" %}
      </button>
    </nav>
  </div>
</header>
