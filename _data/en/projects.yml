- title: Email Attachment Screening Service
  category: Data Engineering · Automation
  repo: email-blacklist-monitor
  summary: >-
    Watches an Outlook mailbox through Microsoft Graph, extracts records from
    Excel, CSV, PDF and image attachments (with OCR), matches them against a
    blacklist and sends automatic alerts.
  highlights:
    - Azure AD app authentication with MSAL
    - Text extraction from PDFs (PyMuPDF) and images (Tesseract OCR)
    - Rule-based matching on ID numbers, name combinations and registration numbers
  stack: [Python, Microsoft Graph, Azure AD, Pandas, OCR]

