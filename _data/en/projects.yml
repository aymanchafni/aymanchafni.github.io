- title: Maritime AIS Data Pipeline
  category: Data Engineering
  featured: true
  repo: simple-ais-pipeline
  summary: >-
    End-to-end pipeline for port-traffic monitoring (Tanger Med): ingests ship
    tracking (AIS) data from NOAA, cleans it, computes vessel metrics and serves
    them through a REST API and an interactive dashboard.
  highlights:
    - Ingestion from NOAA AIS archives or local CSV/ZIP files
    - Cleaning (invalid positions, duplicates) and derived metrics such as distance travelled and time at dock
    - PostgreSQL storage, FastAPI endpoints and a Streamlit dashboard
    - Scheduled with Airflow; the full stack starts with one docker-compose command
  stack: [Python, Airflow, PostgreSQL, FastAPI, Streamlit, Docker]

- title: "ETL vs ELT: Pandas vs dbt Benchmark"
  category: Data Engineering
  featured: true
  repo: etl_vs_dbt
  summary: >-
    A side-by-side study of an imperative ETL pipeline (Python + Pandas) and a
    declarative ELT pipeline (dbt), both on DuckDB, building the same star
    schema from TPC-H data.
  highlights:
    - Generates TPC-H data at configurable scale factors and stores it as Parquet
    - Builds the same dimensional model (fact_sales + customer, product, region and date dimensions) both ways
    - Benchmarks execution time, CPU time, peak memory and throughput per table and scale factor
    - Compares data-quality testing, code complexity (LOC, cyclomatic complexity, maintainability index) and lineage
  stack: [Python, dbt, DuckDB, Pandas, Parquet, Plotly]

- title: Multi-City Weather Pipeline
  category: Data Engineering
  featured: true
  repo: airflow_meteo
  summary: >-
    An Airflow DAG that pulls daily weather data for Montréal and Paris from the
    Open-Meteo API in parallel, then merges, transforms and saves the results.
  highlights:
    - Fan-out / fan-in dependency graph (parallel extract → merge → transform → load)
    - Raw JSON landing zone, then tabular outputs with Pandas
    - Runs locally with Docker Compose
  stack: [Airflow, Python, Pandas, Docker]

