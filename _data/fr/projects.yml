- title: Pipeline de données AIS maritimes
  category: Ingénierie des données
  featured: true
  repo: simple-ais-pipeline
  summary: >-
    Pipeline batch qui ingère les données de positionnement des navires (AIS) de
    la NOAA, les nettoie, les charge de façon idempotente dans PostgreSQL et sert
    des métriques par navire via une API REST et un tableau de bord. Testé sur
    200 000 positions réelles (12 600 navires).
  highlights:
    - "Chargements idempotents (COPY vers une table de transit + INSERT … ON CONFLICT) : relancer une journée n'insère rien en double"
    - Métriques de distance et de temps vectorisées, règles de qualité explicites et testées
    - DAG Airflow avec reprise historique et tâche de contrôle qualité; diffusion FastAPI + Streamlit
    - Tests pytest (unitaires, API, intégration) et CI GitHub Actions; démarrage en une commande Docker Compose
  stack: [Python, Airflow, PostgreSQL, FastAPI, Streamlit, Docker]

- title: "ETL vs ELT : banc d'essai Pandas contre dbt"
  category: Ingénierie des données
  featured: true
  repo: etl_vs_dbt
  summary: >-
    Construit deux fois le même schéma en étoile TPC-H, avec Python + pandas (ETL)
    et avec dbt sur DuckDB (ELT), vérifie que les tables produites sont
    identiques, puis compare vitesse, mémoire, tests et complexité. Sur 6 M de
    lignes, l'ELT est ~5× plus rapide et utilise ~6× moins de mémoire.
  highlights:
    - Échantillons communs et cohérents pour que les deux pipelines traitent exactement les mêmes données
    - "Mesures équitables : temps par modèle issus de dbt, mémoire de toute l'arborescence de processus, préchauffage"
    - Vérification d'équivalence des sorties, 29 tests de qualité de chaque côté, banc d'essai reproductible sous Docker
    - "Sur de petits volumes, pandas l'emporte (coût fixe de dbt) : le point de bascule est mesuré"
  stack: [Python, dbt, DuckDB, Pandas, Parquet, Docker]

- title: Pipeline météo multi-villes
  category: Ingénierie des données
  featured: true
  repo: airflow_meteo
  summary: >-
    Pipeline Airflow quotidien qui récupère la météo de cinq villes via l'API
    Open-Meteo, la valide et l'insère (upsert) dans un entrepôt DuckDB, avec
    rattrapage et retraitement de n'importe quelle journée passée.
  highlights:
    - Mappage dynamique des tâches (une tâche d'extraction par ville configurée) avec l'API TaskFlow
    - Exécutions idempotentes partitionnées par date; les données d'archive remplacent les prévisions
    - Contrôle qualité qui fait échouer l'exécution avant tout chargement de données invalides
    - Logique dans un paquet Python testé sans Airflow, plus un test d'intégrité du DAG en CI
  stack: [Airflow, Python, DuckDB, Pandas, Docker]

- title: Metah-Viz — métaheuristiques en direct
  category: Optimisation · Visualisation
  featured: true
  repo: metah-viz
  summary: >-
    Laboratoire interactif pour observer en temps réel l'optimisation par essaims
    particulaires, l'évolution différentielle, le recuit simulé, la descente et la
    recherche aléatoire, et les comparer statistiquement sur plusieurs graines.
  highlights:
    - Optimiseurs NumPy écrits comme générateurs, diffusés au navigateur par Server-Sent Events
    - Fonctions de référence et un problème de conception industrielle contraint en 4 dimensions
    - "Mode comparaison : convergence moyenne selon le budget d'évaluations, moyenne ± écart-type, taux de succès"
    - Visualisation canvas Next.js / TypeScript; 27 tests du backend; Docker Compose
  stack: [Python, NumPy, FastAPI, Next.js, TypeScript]

- title: Service de filtrage des pièces jointes courriel
  category: Ingénierie des données · Automatisation
  repo: email-blacklist-monitor
  summary: >-
    Surveille une boîte Outlook via Microsoft Graph, extrait le texte des pièces
    jointes Excel, CSV, PDF et images (OCR), le compare à une liste noire et envoie
    des alertes, sans manquer de courriel ni échouer silencieusement.
  highlights:
    - Correspondance normalisée et délimitée des identifiants, plaques et noms dans du texte bruité
    - Curseur UTC persistant, pagination Graph, renouvellement du jeton et nouvelles tentatives
    - 18 tests, dont l'extraction réelle de PDF, XLSX et OCR
  stack: [Python, Microsoft Graph, MSAL, Pandas, OCR]

