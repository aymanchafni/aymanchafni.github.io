# ---------------------------------------------------------------------------
# Site settings — edit these, then push. GitHub Pages rebuilds automatically.
# (Changes to this file need a restart if you run `jekyll serve` locally.)
# ---------------------------------------------------------------------------
title: Ayman Chafni
tagline: Data Engineer · Data Scientist
description: >-
  Data engineer and data scientist based in Montréal. I build reliable data
  pipelines (Python, Spark, Airflow, dbt, SQL) and the machine-learning models
  that run on top of them.
url: "https://aymanchafni.github.io"
baseurl: ""
lang: en
timezone: America/Toronto

author:
  name: Ayman Chafni
  email: aymanchafni@gmail.com
  github: aymanchafni
  linkedin: ayman-chafni
  location: Montréal, QC
  photo: /assets/img/ayman.jpg
  cv: /assets/files/Ayman-Chafni-CV.pdf

# Used by jekyll-seo-tag for link previews (LinkedIn, Slack, X…)
image: /assets/img/og-card.jpg
logo: /assets/img/apple-touch-icon.png
social:
  name: Ayman Chafni
  links:
    - https://github.com/aymanchafni
    - https://www.linkedin.com/in/ayman-chafni/

# Visitor analytics with GoatCounter (free, open source, no cookies).
# 1. Create a site at https://www.goatcounter.com/signup and pick a code, e.g. "aymanchafni"
#    -> your dashboard (visits, countries/regions, referrers, pages) is https://aymanchafni.goatcounter.com
# 2. Put that code below. Leave it empty to disable analytics.
# Only the published site counts visits: local previews (`jekyll serve`) are never counted.
analytics:
  goatcounter: "aymanchafni"
  # Show the total number of visits in the footer. Also enable
  # "Allow adding visitor counts on your website" in GoatCounter's site settings.
  show_visits: true

# Articles live in _posts/ and are served at /blog/<year>/<slug>/
permalink: /blog/:year/:title/

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

# Only plugins supported by GitHub Pages
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

# Languages: English lives at the root, French under fr/.
#   English article → _posts/YYYY-MM-DD-title.md      → /blog/YYYY/title/
#   French article  → fr/_posts/YYYY-MM-DD-titre.md   → /fr/blog/YYYY/titre/
# Give two translations the same `ref:` so the language switch links them.
defaults:
  - scope:
      path: ""
    values:
      layout: default
      lang: en
      locale: en_CA
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      lang: en
      locale: en_CA
  - scope:
      path: "fr"
    values:
      lang: fr
      locale: fr_CA
  - scope:
      path: "fr"
      type: posts
    values:
      layout: post
      lang: fr
      locale: fr_CA
      permalink: /fr/blog/:year/:title/

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .jekyll-cache
  - .vscode
  - docker-compose.yml
