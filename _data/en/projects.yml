- title: Maritime AIS Data Pipeline
  category: Data Engineering
  featured: true
  repo: simple-ais-pipeline
  summary: >-
    Batch pipeline that ingests ship-tracking (AIS) data from NOAA, cleans it,
    loads it idempotently into PostgreSQL and serves per-vessel metrics through
    a REST API and a dashboard. Tested on 200,000 real positions (12,600 vessels).
  highlights:
    - "Idempotent loads (COPY into staging + INSERT … ON CONFLICT): re-running a day inserts nothing twice"
    - Vectorised distance and time metrics with explicit, unit-tested data-quality rules
    - Airflow DAG with backfill support and a quality-check task; FastAPI + Streamlit serving
    - pytest (unit, API, integration) and GitHub Actions CI; one-command Docker Compose setup
  stack: [Python, Airflow, PostgreSQL, FastAPI, Streamlit, Docker]

- title: "ETL vs ELT: Pandas vs dbt Benchmark"
  category: Data Engineering
  featured: true
  repo: etl_vs_dbt
  summary: >-
    Builds the same TPC-H star schema twice, with Python + pandas (ETL) and with
    dbt on DuckDB (ELT), verifies both produce identical tables, then compares
    speed, memory, testing and complexity. On 6M rows, ELT is ~5× faster with
    ~6× less memory.
  highlights:
    - Shared, referentially consistent samples so both pipelines process exactly the same data
    - "Fair measurement: per-model times from dbt run_results, process-tree memory sampling, warm-up runs"
    - Output equivalence check, 29 data-quality tests per side, reproducible Docker benchmark
    - Small data favours pandas (dbt's fixed overhead); the crossover is measured, not assumed
  stack: [Python, dbt, DuckDB, Pandas, Parquet, Docker]

- title: Multi-City Weather Pipeline
  category: Data Engineering
  featured: true
  repo: airflow_meteo
  summary: >-
    Daily Airflow pipeline that fetches weather for five cities from the
    Open-Meteo API, validates it and upserts it into a DuckDB warehouse, with
    catch-up and re-processing of any past day.
  highlights:
    - Dynamic task mapping (one fetch task per configured city) with the TaskFlow API
    - Idempotent, date-partitioned runs; archive data replaces earlier forecasts on re-runs
    - Data-quality gate that fails the run before loading bad data
    - Logic in a plain Python package, unit-tested without Airflow, plus a DAG integrity test in CI
  stack: [Airflow, Python, DuckDB, Pandas, Docker]

- title: Metah-Viz — Metaheuristics, Live
  category: Optimization · Data Viz
  featured: true
  repo: metah-viz
  summary: >-
    Interactive lab to watch PSO, differential evolution, simulated annealing,
    hill climbing and random search explore a landscape in real time, and to
    compare them statistically over many seeds.
  highlights:
    - NumPy optimizers written as generators, streamed to the browser over Server-Sent Events
    - Benchmark functions plus a constrained 4-D engineering design problem
    - "Compare mode: mean convergence vs. evaluation budget, mean ± std and success rate"
    - Next.js / TypeScript canvas visualisation; 27 backend tests; Docker Compose
  stack: [Python, NumPy, FastAPI, Next.js, TypeScript]

- title: Email Attachment Screening Service
  category: Data Engineering · Automation
  repo: email-blacklist-monitor
  summary: >-
    Watches an Outlook mailbox through Microsoft Graph, extracts text from
    Excel, CSV, PDF and image attachments (OCR), matches it against a blacklist
    and sends alerts, without missing mail or failing silently.
  highlights:
    - Normalised, boundary-aware matching of IDs, plates and names in messy document text
    - Persistent UTC cursor, Graph pagination, token refresh and retries
    - 18 tests including real PDF/XLSX/OCR extraction
  stack: [Python, Microsoft Graph, MSAL, Pandas, OCR]

