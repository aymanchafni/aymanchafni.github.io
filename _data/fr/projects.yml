- title: Pipeline de données AIS maritimes
  category: Ingénierie des données
  featured: true
  repo: simple-ais-pipeline
  summary: >-
    Pipeline de bout en bout pour le suivi du trafic portuaire (Tanger Med) :
    ingestion des données de positionnement des navires (AIS) de la NOAA,
    nettoyage, calcul de métriques par navire et diffusion via une API REST et
    un tableau de bord interactif.
  highlights:
    - Ingestion depuis les archives AIS de la NOAA ou des fichiers CSV/ZIP locaux
    - Nettoyage (positions invalides, doublons) et métriques dérivées comme la distance parcourue et le temps à quai
    - Stockage PostgreSQL, points d'accès FastAPI et tableau de bord Streamlit
    - Planifié avec Airflow; toute la pile démarre avec une seule commande docker-compose
  stack: [Python, Airflow, PostgreSQL, FastAPI, Streamlit, Docker]

- title: "ETL vs ELT : banc d'essai Pandas contre dbt"
  category: Ingénierie des données
  featured: true
  repo: etl_vs_dbt
  summary: >-
    Étude comparative d'un pipeline ETL impératif (Python + Pandas) et d'un
    pipeline ELT déclaratif (dbt), tous deux sur DuckDB, qui construisent le même
    schéma en étoile à partir des données TPC-H.
  highlights:
    - Génération des données TPC-H à différents facteurs d'échelle, stockées en Parquet
    - Construction du même modèle dimensionnel (fact_sales + dimensions client, produit, région et date) des deux façons
    - Mesure du temps d'exécution, du temps CPU, du pic mémoire et du débit par table et par facteur d'échelle
    - Comparaison des tests de qualité, de la complexité du code (LOC, complexité cyclomatique, indice de maintenabilité) et du lignage
  stack: [Python, dbt, DuckDB, Pandas, Parquet, Plotly]

- title: Pipeline météo multi-villes
  category: Ingénierie des données
  featured: true
  repo: airflow_meteo
  summary: >-
    Un DAG Airflow qui récupère en parallèle les données météo quotidiennes de
    Montréal et de Paris depuis l'API Open-Meteo, puis les fusionne, les
    transforme et sauvegarde les résultats.
  highlights:
    - Graphe de dépendances en éventail (extractions parallèles → fusion → transformation → chargement)
    - Zone d'atterrissage JSON brute, puis sorties tabulaires avec Pandas
    - Exécution locale avec Docker Compose
  stack: [Airflow, Python, Pandas, Docker]

- title: Metah-Viz — visualisation de métaheuristiques
  category: Optimisation · Visualisation
  featured: true
  repo: metah-viz
  summary: >-
    Application web interactive pour observer en temps réel des algorithmes
    d'optimisation explorer une fonction : un backend Python diffuse chaque
    itération vers un graphique mis à jour en direct.
  highlights:
    - Le backend FastAPI diffuse les itérations de l'optimiseur au client
    - Le frontend Next.js / TypeScript affiche la recherche en direct
  stack: [Python, FastAPI, Next.js, TypeScript]

- title: Service de filtrage des pièces jointes courriel
  category: Ingénierie des données · Automatisation
  repo: email-blacklist-monitor
  summary: >-
    Surveille une boîte Outlook via Microsoft Graph, extrait les données des
    pièces jointes Excel, CSV, PDF et images (avec OCR), les compare à une liste
    noire et envoie des alertes automatiques.
  highlights:
    - Authentification d'application Azure AD avec MSAL
    - Extraction de texte des PDF (PyMuPDF) et des images (OCR Tesseract)
    - Correspondance par règles sur les numéros d'identité, combinaisons de noms et numéros d'immatriculation
  stack: [Python, Microsoft Graph, Azure AD, Pandas, OCR]

